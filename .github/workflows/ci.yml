name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit, contract, route and integration tests. Integration tests run on PGlite (in-process
      # Postgres), so no database, Docker or secrets are needed.
      - name: Test
        run: npm test

      # The production build must not need a database or any secret (every data-reading route is
      # rendered at request time). Deliberately no env vars here.
      - name: Build
        run: npm run build
